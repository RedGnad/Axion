# Render Blueprint — deploys the Arena as one always-on web service (UI + SSE + round runner).
# In Render: New → Blueprint → connect this repo. Set the secret env vars below in the dashboard
# (they are sync:false so they are NOT stored in git). PORT is injected by Render automatically.
services:
  - type: web
    name: axion-arena
    runtime: node
    plan: free # NOTE: free spins down after ~15 min idle (cold start + agents drop offline).
    buildCommand: npm install
    startCommand: npm run arena-server:prod
    healthCheckPath: /api/ping
    envVars:
      - key: CROO_API_URL
        sync: false
      - key: CROO_WS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COMPETITOR_BULL_SDK_KEY
        sync: false
      - key: COMPETITOR_BEAR_SDK_KEY
        sync: false
      - key: COMPETITOR_QUANT_SDK_KEY
        sync: false
      - key: BASE_RPC_URL
        sync: false
      - key: ARENA_WINDOW_SECONDS
        value: "60"
      - key: ARENA_THESIS_WINDOW_SECONDS
        value: "900"
      - key: ARENA_DAILY_THESIS_RACES
        value: "1"
      # ── Optional env (set in the Render dashboard, sync:false; each enables a feature) ──
      # CADENCE / COLD-START:
      #   ARENA_WINDOW_SECONDS  — default manual/auto "Blitz" race horizon (60s).
      #   ARENA_THESIS_WINDOW_SECONDS — secondary "Thesis" event horizon (900s = 15m) for richer
      #                           data agents; same racers/economics, longer settlement window.
      #   ARENA_DAILY_THESIS_RACES — daily cap for the Thesis event (default 1; resets UTC).
      #   ARENA_AUTO_ROUND_MS   — ms between scheduled rounds (the "NEXT" countdown). Keep it
      #                           high while funds are low; lower it once the persona wallets are funded.
      #   ARENA_DAILY_RACES     — bounded free races/day from our treasury (default 12; resets UTC).
      #   ARENA_AUTORUN=1       — run one round immediately at boot (demo only).
      # OPEN ROSTER (external agents):
      #   ALLOW_AGENT_SUBMIT=1  — enable the Garage "join" endpoint (/api/competitor).
      #   ARENA_SDK_KEY         — SDK-Key of the "arena buyer" agent (CROO Dashboard) that HIRES external
      #                           agents + re-instantiates the durable roster at boot. Falls back to
      #                           CROO_SDK_KEY. Its AA wallet needs USDC (it pays each external hire).
      #                           REQUIRED to actually run external agents; until then, leave unset.
      #   COMPETITOR_ROSTER     — comma-separated "label=serviceId" seed roster (alternative to joins).
      # HUMAN USDC BETTING + WINNING-AGENT PURSE:
      #   HOUSE_EOA_ADDRESS / HOUSE_EOA_PRIVATE_KEY — dedicated throwaway EOA (small Base ETH) that
      #                           receives bettor USDC and pays winners + the winning-agent purse.
      #   HOUSE_MAX_BET_USDC    — per-bet cap (default 1).
      #   BET_DECAY_FRACTION    — reveal-window fraction before USDC bets close and odds hit x1
      #                           (default 0.30; free picks can stay open after this).
      #   BOOKMAKER_RAKE_BPS    — house rake (default 300 = 3%).
      #   WINNER_RAKE_BPS       — winning-agent purse (default 200 = 2%); only withheld when payable.
      #   ARENA_PAYOUT_SLICER / ARENA_PAYOUT_TANKER / ARENA_PAYOUT_WIZORD — payout address per persona
      #                           (the 2% purse goes here when that agent wins). No address → no purse.
      # FRONTEND_URL            — where GET / redirects (the Vercel app).
